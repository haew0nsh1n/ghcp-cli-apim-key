[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "pii-filter"
version = "0.1.0"
description = "Request-side PII and secret inspection for the self-hosted gateway"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.163.1",
    "uvicorn==0.54.0",
    "regex==2026.11.9",
]

[project.optional-dependencies]
dev = ["httpx==0.28.1"]

[tool.setuptools]
packages = ["app"]
